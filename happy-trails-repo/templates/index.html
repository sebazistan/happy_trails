<!doctype html>
<html lang="en">
<!-- ═══════════════════════════════════════════════════════════════════════════
     HAPPY TRAILS — interactive map
     version 4.4

     A pan-and-zoom map built from one Illustrator file, where every layer can
     be switched on and off independently.

     THE FILES
       index.html               this file: your settings, your words, the engine
       happy-trails.css         every colour, size and font — ONE file,
                                shared by every page on the site
       legend/                  the legend's icons, one SVG per row. The trail
                                map reads the same folder, so an icon redrawn
                                here changes on both pages.
       map.svg                  the artwork, as a separate file if you'd rather
                                host it than paste it in (see SETTINGS.artwork)

     MASKS — worth knowing if you re-export
     Illustrator layer opacity comes out of the renderer as a <mask> holding one
     grey rectangle. A <mask> is measured against the masked element's bounding
     box by default, so a layer whose artwork is a perfectly straight horizontal
     or vertical line has a bounding box of zero height, the mask collapses, and
     the layer vanishes. The Finch route is exactly that shape and rendered as
     nothing at all until merge.py started converting those masks into a plain
     opacity on the group — which is exactly equivalent, and cheaper to draw.
     Waterfront and Meadoway were partly clipped by the same thing.

     HOW THE ARTWORK WORKS
       Every layer of HT_89.ai was rendered to its own SVG, then merged into one
       document in which each layer is a group: <g id="layer-trails">, and so on.
       They all share the artboard's viewBox, 0 0 6546.78 3372.52, so they line
       up perfectly by construction. Switching a layer off sets display:none on
       its group, which takes it out of the browser's render tree completely —
       unlike opacity:0, which keeps painting it every frame.

     WHAT TO EDIT — each has a banner like this one:
       ①  SETTINGS   sizes, speeds, zoom limits, behaviour
       ②  WORDS      every piece of text on screen, and the legend's rows
       ③  LAYERS     the ten named routes, and which switches control what
       ④  BUTTONS    the labels drawn on the map
       ⑤  ICONS      the legend's drawings, at the bottom of the file
       ⑤  ARTWORK    the map itself, at the very bottom of the file
     Everything between ④ and ⑤ is the engine and needs no edits.

     VERSION HISTORY
       4.4  a Wishful link in the navigation bar, between Trails and About,
            and every page carries analytics.js — which counts nothing until
            one line in that file names a provider.
       4.3  the how-to line along the bottom is hidden on a phone. It is written
            for a mouse — the wheel, and click to zoom out — so two of its three
            sentences describe something a phone reader does not have, and the
            one that is left tells them to drag a map, which they know. It stays
            on the desktop, where all three sentences are worth saying. The
            words are untouched in SETTINGS; only the small-screen block in
            happy-trails.css takes it off the page.
       4.2  the pink highlight over a wishful route no longer comes on with the
            Wishful thinking switch. It belongs to the button, the way it does
            for the ten built routes: the switch draws the proposed lines, and
            pointing at a route's button picks that one out of them. The switch
            had been listing each wishful route's own highlight layer alongside
            the lines, so both were lit at once and the button had nothing left
            to do.
            Two smaller faults fell out of the same place. The hover code asked
            whether Trails or Main Routes was on before lighting ANY route —
            true for the ten built ones, meaningless for a wishful one, whose
            button belongs to Wishful thinking; it now asks the route itself.
            And on leaving a button it checked only Main Routes before putting
            the layer away, so a route held on by any other switch would have
            been hidden by a passing pointer. Which switch is holding a route
            on is now worked out from LAYER_GROUPS rather than written down —
            writing it down is how this went wrong in the first place.
            The two purple buttons had both been measured at their routes'
            southern tips, six pixels apart, so one label sat across the other.
            Etobicoke Crk S has moved up its own line.
       4.1  a closed panel was still catching clicks: at opacity 0 it stayed a
            solid pane over a third of the window, swallowing switch clicks and
            map drags alike. The `hidden` attribute had been set all along but
            does nothing against a rule that gives the element a display of its
            own. Fixed with pointer-events and visibility, and [hidden] spelled
            out. The same fault was in the trail map and is fixed there too.
       4.0  artwork from HT_91.ai — unpaved trails now carry their own labels,
            so the Unpaved switch drives them too. The route buttons on the map
            follow the Trails and Main Routes switches: with both off there are
            no buttons and so no pink highlight either. Legend icons load from
            the legend/ folder again, shared with the trail map.
       3.1  the legend's icons are built into this file rather than loaded from
            a legend/ folder beside it. The folder was too easy to get wrong —
            unzipping a new set next to an old one leaves the old names in
            place and half the legend comes up blank, with nothing on screen to
            say why. SETTINGS.legendFolder still switches back to files, and
            now says so loudly in the console when one does not load.
       3.0  new artwork from HT_90.ai: 33 layers, with each of the ten named
            routes on its own layer instead of one "main routes" bundle — which
            is what lets a single route light up as you point at its button.
            Unpaved trails get their own switch. The layer switches are in two
            columns with a Reset button. Zooming out is capped closer in, and
            both zoom buttons and FIT now ease rather than jump. The legend uses
            the icons exported from Illustrator. Pin labels sit on their routes,
            with no stem, and no text on the page can be selected by dragging.
            One real bug fixed on the way in: see MASKS, below.
       2.0  restyled to match the scrolling trail map: the same navigation bar,
            a corner title with link buttons, a fixed left rail carrying the
            compass and the two panel buttons, and ONE panel that swaps between
            Legend and Layers — which is what stops a button coming adrift from
            its panel, as the two sliding drawers could in 1.0. The legend is no
            longer pasted artwork but a list of rows drawn from legend/, shared
            with the trail map. Layer switches are now sliding switches with a
            line of explanation each.
       1.0  first build: pan/zoom, layer switches, legend, trail pins
     ═══════════════════════════════════════════════════════════════════════════ -->

<script>
(function () {
  "use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   ①  SETTINGS
   Every number the engine uses. Colours, fonts and spacing are in the
   stylesheet instead — only things the code has to do arithmetic with are here.
   ═══════════════════════════════════════════════════════════════════════════ */

const SETTINGS = {

  version: "4.4",              // printed in the bottom-right corner

  /* ── THE ARTWORK ────────────────────────────────────────────────────── */

  artwork: "inline",           // "inline"   use the <svg> at the bottom of this
                               //            file. Works however you open the
                               //            page, including double-clicking it.
                               // "map.svg"  load it as a separate file instead.
                               //            Lighter page, cacheable — but only
                               //            works over http, because browsers
                               //            refuse to read a local SVG off the
                               //            disk. Fine once the site is hosted.

  mapSize: null,               // [width, height] of the artwork in its own
                               // units. null reads it from the SVG's viewBox,
                               // which is what you want.

  /* ── ZOOM ───────────────────────────────────────────────────────────── */
  /* Zoom is a plain scale factor: 1 means the artwork is drawn at its true
     size, which for this map is 6547 units across — far wider than any screen.
     "Fit" is whatever scale makes the whole map visible, usually around 0.2.  */

  /* ── HOW FAR OUT YOU MAY GO ──────────────────────────────────────────────
     "Fit" used to mean the whole artboard edge to edge, which on a wide screen
     left the map small and marooned in the middle. It now means a set fraction
     of the way in from that, so the map fills more of the screen and there is
     less empty ground to pan across. Both numbers move together: --fit is what
     the FIT button goes to, and you cannot pull back beyond it.             */

  fitMeans: "cover",           // what the FIT button goes to, and how far out
                               // you may pull:
                               //   "cover"  the closest-in zoom at which the map
                               //            still fills the screen in both
                               //            directions. No empty bands, ever,
                               //            and it works itself out from the
                               //            window's shape rather than from a
                               //            number that only suits one screen.
                               //   "whole"  the entire artboard visible, which
                               //            is what 1.0 and 2.0 did — on a wide
                               //            screen that left the map small with
                               //            dark ground above and below it.
  fitZoom: 1.0,                // a nudge on top of that. Below 1 pulls back a
                               // little (and lets some empty ground show);
                               // above 1 goes in closer still.
  fitPadding: 1.0,             // kept for "whole", where a margin makes sense
  minZoomOfFit: 1.0,           // how far out you may zoom, as a multiple of the
                               // FIT zoom above. 1 = FIT is as far out as it
                               // goes, which is what stops the map shrinking
                               // into the middle of the screen.
  maxZoom: 1.6,                // how far in you may zoom. 1 = the artwork at
                               // true size; above that it starts to soften.
  zoomStep: 1.55,              // how much one button press or one click
                               // multiplies the zoom by
  wheelStrength: 0.0022,       // how much a wheel notch zooms. Bigger = faster
                               // and twitchier; this is tuned for trackpads.

  startZoom: "fit",            // where the map opens on a normal screen:
                               //   "fit"    the whole map, edge to edge
                               //   "cover"  filled to the screen, so you pan
                               //   a number for a set zoom
  phoneStartZoom: "cover",     // the same, on a narrow screen. The whole of a
                               // map this wide is unreadable on a phone, so it
                               // opens filled to the screen instead. The FIT
                               // button still pulls back to the whole map.
  phoneWidth: 700,             // screens narrower than this count as phones

  startCentre: null,           // [x, y] in map units to open centred on.
                               // null centres the map.

  /* ── MOVEMENT AND FEEL ──────────────────────────────────────────────── */

  glide: 0.22,                 // how quickly the map settles after a zoom.
                               // 1 = instant and rigid, 0.05 = slow and
                               // floaty. Dragging is always 1:1 with your
                               // hand — this only affects zooming.
  buttonGlide: 0.11,           // the same, but for the +, - and FIT buttons.
                               // Lower than `glide` on purpose: a press has no
                               // pointer to keep up with, so it can afford to
                               // ease into place instead of snapping.
  easeForMs: 700,              // how long that gentler easing lasts after a
                               // press, before dragging gets its normal feel
                               // back. A touch longer than the move itself.
  pressMs: 180,                // how long the button holds its pressed look

  clickZoomsOut: true,         // a plain click on the map zooms out one step,
                               // the way the Webflow version behaves. Clicks on
                               // pins and buttons are ignored.
  doubleClickZoomsIn: false,   // leave this false while clickZoomsOut is true,
                               // or a double-click fires two zoom-outs first.

  dragThreshold: 4,            // pixels of movement before a press counts as a
                               // drag rather than a click

  /* ── THE TRAIL PINS ─────────────────────────────────────────────────── */

  pinScaleWithMap: false,      // false keeps pins the same size on screen at
                               // every zoom. true lets them grow with the map.
  pinsFadeBelowZoom: 0,        // hide the pins when zoomed further out than
                               // this multiple of fit. 0 = always show them.

  /* Point at a route's button and that one route fades up on the map, so you
     can see where it runs without switching the whole set on. If the Main
     Routes switch is already on they are all drawn anyway and pointing at a
     button changes nothing — which is the intended behaviour, not a bug. */
  highlightRouteOnHover: true,
  routeFadeMs: 220,            // how long that fade takes, in and out

  /* ── EXTRAS ─────────────────────────────────────────────────────────── */

  legendFolder: "icons/",      // where the legend's little drawings come from:
                               // one SVG per row, named after the row's
                               // `swatch` in WORDS.legend, so a row asking for
                               // "trails" reads icons/trails.svg.
                               // This was legend/. Every drawing on the site —
                               // these, and the coins and gauges a wishful stop
                               // carries — is in icons/ now, because two folders
                               // of drawings only made anyone adding a third
                               // kind guess which one it went in.
                               // MUST END IN A SLASH.
                               //
                               // The trail map reads this same folder, which is
                               // why both pages agree about what a symbol
                               // means. Redraw an icon once and it changes on
                               // both.
                               //
                               // Set it to null to use the copies built into
                               // this file instead (section ⑤ near the bottom).
                               // That needs no folder at all and is the safer
                               // choice if the icons ever go astray — but the
                               // folder is easier to edit, so it is the default.

  legendFallback: true,        // if a file does not load, quietly fall back to
                               // the built-in copy of that icon rather than
                               // leaving a hole in the legend. The console still
                               // says which file was missing, so this hides the
                               // blemish without hiding the problem.

  showLegend: true,            // the LEGEND button on the rail, and its panel
  showLayers: true,            // the LAYERS button, and its panel
  showCompass: true,           // the north badge at the top of the rail. The
                               // map is drawn north-up, so it is a fixed label
                               // rather than a needle that turns.
  openPanelAtStart: null,      // "legend", "layers", or null to start closed

  coordinateReader: true,      // press C to read map coordinates off the map,
                               // which is how you find x/y values for new pins
  showFitButton: true
};


/* ═══════════════════════════════════════════════════════════════════════════
   ②  WORDS
   Every piece of text on screen. None of it affects how the map works.
   ═══════════════════════════════════════════════════════════════════════════ */

const WORDS = {
  browserTab:   "Happy Trails",
  brand:        "Happy Trails",
  brandHref:    "index.html",

  nav: [                                        // the links along the top
    { label: "Map",     href: "index.html",         here: true  },
    { label: "Trails",  href: "trails.html",  here: false },
    { label: "Wishful", href: "wishful.html", here: false },
    { label: "About",   href: "about.html",   here: false },
    { label: "Contact", href: "contact.html", here: false },
    { label: "Buy me a coffee", short: "Coffee",
      href: "https://buymeacoffee.com/sebazistan", here: false,
      newTab: true, kind: "coffee" }
  ],

  cornerKicker:  "Cycling network \u00b7 Toronto",
  cornerTitle:   "Happy Trails",

  /* The link buttons under the corner title. A button with an empty href is
     left off entirely; clear all three and the row disappears. Written the
     same way as the trail map's, so the two pages can share a block. */
  trailLinks: [
    { label: "Download map", href: "maps/happy-trails-map.svg", download: true }
    /* Clear a href and that button is left off the page; clear them all and
       the row disappears and the band above closes up to suit. */
  ],

  north:        "N",                 /* the letter on the compass badge  */
  northLabel:   "North is up",       /* its screen-reader description    */

  legendName:   "Legend",
  legendTitle:  "Legend",
  legendNote:   "",
  /* Each row names its drawing. That drawing comes from section ⑤ at the
     bottom of this file, or from a folder if you set SETTINGS.legendFolder.
     They are drawn at whatever proportions Illustrator gave them and fitted
     into a common box by the stylesheet, so a long thin line symbol and a
     square one both sit on the same left margin.

     To add a row: add a line here, and add an icon of that name to section ⑤
     (or to your folder). To reorder the legend, move the lines. */
  legend: [
    { swatch: "trails",            label: "Trail" },
    { swatch: "bridge",            label: "Bridge" },
    { swatch: "unpaved",           label: "Unpaved trail" },
    { swatch: "under-construction", label: "Under construction" },
    { swatch: "lanes",             label: "Bike lane" },
    { swatch: "connections",       label: "Connection" },
    { swatch: "road-connection",   label: "Road connection" },
    { swatch: "dangerous",         label: "Dangerous connection" },
    { swatch: "crosswalk",         label: "Crosswalk / junction" },
    { swatch: "tunnel",            label: "Bridge / tunnel crossing" },
    { swatch: "stairs",            label: "Stairs" },
    { swatch: "barrier",           label: "Barrier" },
    { swatch: "wishful",           label: "Wishful thinking" },
    { swatch: "roads",             label: "Road" },
    { swatch: "highway",           label: "Highway" },
    { swatch: "rail",              label: "Railway" },
    { swatch: "river",             label: "River" },
    { swatch: "golf",              label: "Golf course" }
  ],

  layersName:   "Layers",
  layersTitle:  "Layers",
  layersNote:   "Anything switched off is removed from the page entirely, so the map stays quick.",
  resetLayers:  "Reset",
  resetTitle:   "Put every switch back to how the page opened",
  closePanel:   "Close",

  hint:         "Drag to move the map. Use the mouse wheel to zoom. Click to zoom out.",

  zoomIn:       "Zoom in",
  zoomOut:      "Zoom out",
  zoomFit:      "Fit the whole map",

  missingArtwork: "The map artwork is missing. Either paste your SVG into the " +
                  "<code>&lt;template id=\"ht-artwork\"&gt;</code> block at the bottom of this " +
                  "file, or set <code>SETTINGS.artwork</code> to a filename and serve the folder " +
                  "over http.",
  missingFile:    "Couldn't load <code>{file}</code>. Browsers refuse to read a local SVG off " +
                  "the disk, so either serve the folder over http — <code>python3 -m http.server</code> " +
                  "— or set <code>SETTINGS.artwork</code> back to <code>\"inline\"</code>."
};


/* ═══════════════════════════════════════════════════════════════════════════
   ③  LAYERS
   Which switches appear in the Layers drawer, and which pieces of artwork each
   one controls.

   The `artwork` list holds group ids from map.svg, minus the "layer-" prefix.
   One switch can drive several groups at once — "Trails" turns on the trails
   themselves, their bridges, the unpaved variants and their labels together.

   `note` is the line of small type under the switch's name in the panel.
   Leave it out and the switch simply shows its name.

   The layers currently in map.svg, bottom of the stack to top:
     black  lake  hydro  bg  connections  trails-unpaved  lanes
     trails-under-construction  trails  golf  rail  highway  lanes-bridge
     trails-under-construction-bridge  trails-bridge  wishful-thinking
     bg-label  city-label  lanes-label  trails-under-construction-label
     trails-label  golf-label  highway-label  main-routes
   ═══════════════════════════════════════════════════════════════════════════ */

/* Always drawn, never switchable — the ground the rest sits on. */
const ALWAYS_ON = ["black", "bg", "bg-label"];

/* THE NAMED ROUTES THAT ARE BUILT.
   In HT_90.ai each one is its own Illustrator layer, so each can be drawn on
   its own. `layer` is the group id in map.svg; `label` is what the button on
   the map says; x and y are where that button sits, in map units.

   The x/y here were measured off the artwork rather than placed by eye: each
   route was rendered on its own, and the point taken is the pixel of that
   route nearest its own centre — so every button sits ON its line rather than
   beside it. If you move a route in Illustrator, re-measure rather than nudge.

   `href` is where the button goes. Beltline has a page of its own; the rest
   land on the trails list until they get one — give a route its own page and
   change its href here, nothing else.

   `needs` ties a button to switches: the button is on the map while ANY of the
   switches named is on, and gone when none of them is. Every route button
   needs Trails or Main Routes, so switching both off clears the map of buttons
   — and with no button to point at there is no pink highlight either, which is
   the behaviour asked for rather than a side effect. */
const ROUTE_NEEDS = ["Trails", "Main Routes"];

/* ═══════════════════════════════════════════════════════════════════════════
   ══  THE ENGINE  ══  No edits needed past this point.
   It is commented anyway, in case you want to change how something works.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── small helpers ─────────────────────────────────────────────────────── */
const el    = id => document.getElementById("ht-" + id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mix   = (a, b, t) => a + (b - a) * t;

/* the artwork's own size, read from its viewBox */
let mapW = 0, mapH = 0, mapSvg = null;

/* A ROUTE, BY THE NAME OF ITS LAYER. The hover code is handed a layer name and
   needs to know two things about it: which switches have to be on for its
   button to be reachable, and which switch — if any — is already drawing it,
   so that leaving the button does not put away something the switch had turned
   on. Both answers live in the route's own entry, which is what this finds. */
const ROUTE_BY_LAYER = new Map(ALL_ROUTES.map(r => [r.layer, r]));

/* Which switch, if any, holds this route's highlight on by itself. Asked of
   LAYER_GROUPS rather than written down, because writing it down is how the
   wishful routes came to be lit by a switch AND by the pointer at the same
   time. Add a route's layer to a switch later and this follows. */
function switchHolding(layer) {
  for (const group of LAYER_GROUPS)
    for (const sw of group.switches)
      if ((sw.artwork || []).indexOf(layer) !== -1) return sw.label;
  return null;
}

/* every switchable piece of artwork, by name */
const artworkGroups = new Map();

/* the live state of each switch, by label */
const switchState = new Map();

function giveUp(html) {
  el("problem").classList.add("is-on");
  el("problem-text").innerHTML = html;
}

/* ── put the words on the page ─────────────────────────────────────────── */
function writeWords() {
  document.title = WORDS.browserTab;
  el("brand").textContent = WORDS.brand;
  el("brand").href = WORDS.brandHref;
  el("nav").innerHTML = WORDS.nav.map(n =>
    '<a href="' + n.href + '"' +
    (n.here ? ' class="is-here"' : '') +
    (n.kind ? ' class="ht-' + n.kind + '"' : '') +
    (n.newTab ? ' target="_blank" rel="noopener"' : '') + '>' +
    /* A link with a `short` form is written twice — the stylesheet shows one
       of them and hides the other, because which one fits is a question about
       the width of the window, and CSS is the only thing that knows that. */
    (n.short ? '<span class="nav-full">' + n.label + '</span>' +
               '<span class="nav-short">' + n.short + '</span>'
             : n.label) +
    '</a>').join("");
  el("cornerKicker").textContent = WORDS.cornerKicker;
  el("cornerTitle").textContent = WORDS.cornerTitle;
  writeTrailLinks();
  el("north").textContent = WORDS.north;
  el("compass").setAttribute("aria-label", WORDS.northLabel);
  el("compass").hidden = !SETTINGS.showCompass;
  el("legendBtn").querySelector(".ht-railName").textContent = WORDS.legendName;
  el("layersBtn").querySelector(".ht-railName").textContent = WORDS.layersName;
  el("legendBtn").title = WORDS.legendName;
  el("layersBtn").title = WORDS.layersName;
  el("legendBtn").hidden = !SETTINGS.showLegend;
  el("layersBtn").hidden = !SETTINGS.showLayers;
  el("panelClose").title = WORDS.closePanel;
  el("hint").textContent = WORDS.hint;
  el("version").textContent = "v" + SETTINGS.version;
  el("zoom-in").title  = WORDS.zoomIn;
  el("zoom-out").title = WORDS.zoomOut;
  el("zoom-fit").title = WORDS.zoomFit;
  if (!SETTINGS.showFitButton) el("zoom-fit").style.display = "none";
}

/* The row of link buttons under the corner title. A link with no href is not
   written, so the row empties itself and the stylesheet's :empty rule takes it
   off the page; with none of them set the band closes up by the height it had
   been reserving. Identical to the trail map's. */
function writeTrailLinks() {
  const wanted = WORDS.trailLinks.filter(link => link && link.href);
  el("links").innerHTML = wanted.map(link =>
    '<a href="' + link.href + '"' +
    (link.download ? ' download' : '') +
    (link.newTab ? ' target="_blank" rel="noopener"' : '') +
    '>' + link.label + '</a>').join("");
  if (!wanted.length) document.documentElement.style.setProperty("--title-links", "0px");
}

/* ── step 1: get the artwork into the page ─────────────────────────────── */
function loadArtwork(next) {
  if (SETTINGS.artwork === "inline") {
    const source = el("artwork");
    const svg = source && source.content.querySelector("svg");
    if (!svg) return giveUp(WORDS.missingArtwork);
    return useSvg(svg.cloneNode(true), next);
  }
  fetch(SETTINGS.artwork)
    .then(r => r.text())
    .then(text => {
      const svg = new DOMParser().parseFromString(text, "image/svg+xml").querySelector("svg");
      if (!svg) throw new Error("no <svg>");
      useSvg(document.importNode(svg, true), next);
    })
    .catch(() => giveUp(WORDS.missingFile.replace("{file}", SETTINGS.artwork)));
}

function useSvg(svg, next) {
  const box = (svg.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
  mapW = (SETTINGS.mapSize && SETTINGS.mapSize[0]) || (box.length === 4 ? box[2] : 1000);
  mapH = (SETTINGS.mapSize && SETTINGS.mapSize[1]) || (box.length === 4 ? box[3] : 1000);

  // the artwork fills the world box exactly, so map units and page pixels agree
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "100%");
  svg.removeAttribute("style");
  svg.id = "ht-map";
  const world = el("world");
  world.style.width  = mapW + "px";
  world.style.height = mapH + "px";
  world.insertBefore(svg, el("pins"));
  mapSvg = svg;

  // index the layer groups so switches can find them
  svg.querySelectorAll('[id^="layer-"]').forEach(g => {
    artworkGroups.set(g.id.replace(/^layer-/, ""), g);
  });
  next();
}

/* ── step 2: the layer switches ────────────────────────────────────────── */
function showArtwork(names, on) {
  names.forEach(name => {
    const g = artworkGroups.get(name);
    // display:none takes the group out of the render tree altogether. Using
    // opacity:0 instead would leave the browser painting it on every frame.
    if (g) g.style.display = on ? "" : "none";
    else console.warn('layer "' + name + '" is not in the artwork');
  });
}

/* Set every switch to the state written in LAYER_GROUPS, and put the artwork
   to match. This runs once, before anything is drawn — the panel is built
   later, from this same state, so the switches you see always agree with what
   is actually on the map. */
function applyStartingLayers() {
  // start with everything off, then turn on what is meant to be on
  artworkGroups.forEach(g => { g.style.display = "none"; });
  showArtwork(ALWAYS_ON, true);
  LAYER_GROUPS.forEach(group => group.switches.forEach(sw => {
    switchState.set(sw.label, !!sw.on);
    showArtwork(sw.artwork, !!sw.on);
  }));
}

/* ── the rail's one panel ────────────────────────────────────────────────
   Both buttons open the same panel and it swaps its contents. Pressing the
   button of the section already showing closes it; so does Escape, and the ×.
   Because the buttons are pinned to the rail and there is only ever one panel,
   a button can never end up detached from the thing it opens — which is what
   went wrong with the two sliding drawers in v1.0.                        */
let openPanel = null;                    // "legend", "layers" or null

/* Where a row's drawing comes from: the icons built into this file, or a
   folder if SETTINGS.legendFolder names one. A row whose icon is missing keeps
   its label and leaves the space blank rather than showing a broken-image
   mark — and says so in the console, because a silently blank legend is a
   miserable thing to debug. */
function legendIcon(swatch) {
  if (SETTINGS.legendFolder) return SETTINGS.legendFolder + swatch + ".svg";
  const built = LEGEND_ICONS[swatch];
  if (!built) console.warn('legend icon "' + swatch + '" is not in LEGEND_ICONS ' +
                           '(section ⑤), so that row has no drawing');
  return built || "";
}

function legendRows() {
  return '<ul class="ht-legend">' + WORDS.legend.map(row =>
    '<li><img class="ht-sw" alt="" src="' + legendIcon(row.swatch) +
    '" data-swatch="' + row.swatch + '"><span>' + row.label +
    "</span></li>").join("") + "</ul>";
}

/* One listener for the whole list rather than an onerror on every row. */
function watchLegendIcons() {
  el("panelBody").addEventListener("error", e => {
    const img = e.target;
    if (!img.classList || !img.classList.contains("ht-sw")) return;
    const swatch = img.dataset.swatch;
    const from = img.getAttribute("src");
    const spare = SETTINGS.legendFallback && LEGEND_ICONS[swatch];
    if (spare) {
      img.src = spare;                       // the built-in copy, so no hole
    } else {
      img.style.visibility = "hidden";
    }
    console.warn('Legend icon "' + swatch + '" did not load from "' + from + '".' +
      (spare ? ' Used the built-in copy instead.' : '') +
      '\n  Check that ' + from + ' really sits beside the page. On Windows,' +
      ' "Extract All" on a zip whose contents are already in a folder gives you' +
      ' legend\\legend\\ — one level too deep.' +
      '\n  Or set SETTINGS.legendFolder to null to use the built-in icons.');
  }, true);      // capture: an <img> error does not bubble
}

/* The switches, in two columns so the whole set is visible without scrolling.
   The columns are a CSS grid — see .ht-switches — so the number of columns is
   a stylesheet decision, not one baked into this markup. */
function layerSwitches() {
  return LAYER_GROUPS.map((group, gi) =>
    '<div class="ht-groupTitle">' + group.title + "</div>" +
    '<div class="ht-switches">' + group.switches.map((sw, si) => {
      const on = switchState.get(sw.label) === true;
      return '<button class="ht-switch' + (on ? " is-on" : "") + '" type="button"' +
             ' role="switch" aria-checked="' + on + '"' +
             ' data-group="' + gi + '" data-switch="' + si + '">' +
             '<span class="ht-track"><span class="ht-knobby"></span></span>' +
             '<span class="ht-switchText"><b>' + sw.label + "</b>" +
             (sw.note ? "<small>" + sw.note + "</small>" : "") +
             "</span></button>";
    }).join("") + "</div>").join("") +
    '<button class="ht-reset" id="ht-reset" type="button" title="' +
    WORDS.resetTitle + '">' + WORDS.resetLayers + "</button>";
}

/* Put every switch back to the `on` value written in LAYER_GROUPS. Worth
   having once someone has turned a dozen things on: there was no way back
   short of reloading the page. */
function resetLayers() {
  applyStartingLayers();
  lightRoute(null);
  updatePins();
  buildPanel();
}

const panelFor = {
  legend: { title: () => WORDS.legendTitle, note: () => WORDS.legendNote, body: legendRows },
  layers: { title: () => WORDS.layersTitle, note: () => WORDS.layersNote, body: layerSwitches }
};

function buildPanel() {
  if (!openPanel) return;
  const p = panelFor[openPanel];
  el("panelTitle").textContent = p.title();
  el("panelNote").textContent = p.note() || "";
  el("panelNote").hidden = !p.note();
  el("panelBody").innerHTML = p.body();
}

function showPanel(which) {
  openPanel = (openPanel === which) ? null : which;
  const panel = el("panel");
  // Opening: take `hidden` off first, or there is nothing to animate.
  // Closing: leave it on until the fade has played — see wirePanel below.
  if (openPanel) panel.hidden = false;
  panel.classList.toggle("is-open", !!openPanel);
  // the switches need two columns' worth of width; the legend does not
  el("panel").classList.toggle("is-layers", openPanel === "layers");
  // on a phone the panel reaches the zoom controls, so they step aside — see
  // the stylesheet's phone block
  document.body.classList.toggle("ht-panel-open", !!openPanel);
  ["legend", "layers"].forEach(name => {
    const button = el(name + "Btn");
    button.classList.toggle("is-on", openPanel === name);
    button.setAttribute("aria-expanded", openPanel === name);
  });
  buildPanel();
}

function wirePanel() {
  watchLegendIcons();

  /* Once the closing fade has finished, put `hidden` back on. The stylesheet
     has already made the panel inert by then (visibility and pointer-events),
     so this is about tidiness and assistive technology rather than about
     clicks — but it also means the panel is genuinely display:none when shut,
     which is the state anyone reading the DOM would expect. */
  el("panel").addEventListener("transitionend", e => {
    if (e.target === el("panel") && e.propertyName === "opacity" && !openPanel) {
      el("panel").hidden = true;
    }
  });

  el("legendBtn").addEventListener("click", () => showPanel("legend"));
  el("layersBtn").addEventListener("click", () => showPanel("layers"));
  el("panelClose").addEventListener("click", () => showPanel(openPanel));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && openPanel) showPanel(openPanel);
  });
  // one listener for every switch, rather than one per button — the panel's
  // contents are rebuilt whenever it opens, so per-button listeners would have
  // to be re-attached each time
  el("panelBody").addEventListener("click", e => {
    if (e.target.closest("#ht-reset")) { resetLayers(); return; }
    const button = e.target.closest(".ht-switch");
    if (!button) return;
    const sw = LAYER_GROUPS[+button.dataset.group].switches[+button.dataset.switch];
    const on = !(switchState.get(sw.label) === true);
    switchState.set(sw.label, on);
    showArtwork(sw.artwork, on);
    button.classList.toggle("is-on", on);
    button.setAttribute("aria-checked", on);
    updatePins();
  });
  // the map must not pan or zoom when the pointer is inside the panel
  ["pointerdown", "wheel", "click"].forEach(kind =>
    el("panel").addEventListener(kind, e => e.stopPropagation()));
}

/* ── step 3: the trail pins ────────────────────────────────────────────── */
let pinEls = [];

function buildPins() {
  el("pins").innerHTML = PINS.map(p =>
    /* The button IS the element — there is no wrapper with a separate label
       inside it any more. That gives it a real box to point at and to tab to,
       rather than a zero-sized anchor whose only clickable part was its
       child. */
    '<a class="ht-pin' + (p.purple ? " is-purple" : "") + '" href="' + (p.href || "#") + '"' +
    (p.layer ? ' data-route="' + p.layer + '"' : "") +
    ' style="left:' + p.x + 'px; top:' + p.y + 'px">' + p.label + "</a>").join("");
  pinEls = Array.from(el("pins").children);
  wireRouteHighlight();
}

/* ── pointing at a route's button ────────────────────────────────────────
   The button lights up just its own route on the map. Only one route is ever
   highlighted, and only while the pointer is on the button.

   The switch matters here: if Main Routes is already on, every route is drawn
   anyway, so leaving the button changes nothing — the code below checks the
   switch before hiding a layer again, rather than blindly turning it off and
   wiping out what the switch had turned on.                                */
let litRoute = null;

function lightRoute(name) {
  // Never light a route whose button is not on the map. The pointer cannot
  // reach a hidden button in practice, but this is the rule stated once rather
  // than left to depend on that — turn Trails and Main Routes both off and no
  // route can be lit by any means.
  // ASK THE ROUTE, not the built routes' switches. This checked Trails and
  // Main Routes for every route there was, which is right for the ten built
  // ones and meaningless for a wishful one — its button belongs to Wishful
  // thinking. Each route states what it needs; this reads it.
  if (name) {
    const r = ROUTE_BY_LAYER.get(name);
    if (r && !needsAreMet(r)) name = null;
  }
  if (litRoute === name) return;
  if (litRoute) {
    const was = artworkGroups.get(litRoute);
    // only put it away if a switch is not holding it on — and which switch
    // that is depends on the route, which is what switchHolding() answers
    const holder = switchHolding(litRoute);
    if (was && !(holder && switchState.get(holder) === true)) was.style.display = "none";
    if (was) was.style.opacity = "";
  }
  litRoute = name;
  if (!name) return;
  const g = artworkGroups.get(name);
  if (!g) return;
  g.style.display = "";
  // a fade rather than a jump. The layer already carries its own opacity from
  // the artwork, so this animates the group's opacity on top of it.
  g.style.transition = "opacity " + SETTINGS.routeFadeMs + "ms ease";
  g.style.opacity = "0";
  requestAnimationFrame(() => { g.style.opacity = "1"; });
}

function wireRouteHighlight() {
  if (!SETTINGS.highlightRouteOnHover) return;
  pinEls.forEach(node => {
    const name = node.dataset.route;
    if (!name) return;
    node.addEventListener("pointerenter", () => lightRoute(name));
    node.addEventListener("pointerleave", () => lightRoute(null));
    // a keyboard user gets the same thing on focus
    node.addEventListener("focus", () => lightRoute(name));
    node.addEventListener("blur", () => lightRoute(null));
  });
}

/* Is this button's layer switched on? `needs` may name one switch or several;
   several means "any of these", so a route button shows while EITHER Trails or
   Main Routes is on. With both off the button goes, and because a hidden
   button cannot be pointed at, the pink highlight goes with it. */
function needsAreMet(p) {
  if (!p.needs) return true;
  const wanted = Array.isArray(p.needs) ? p.needs : [p.needs];
  return wanted.some(name => switchState.get(name) === true);
}

function updatePins() {
  const farOut = SETTINGS.pinsFadeBelowZoom > 0 &&
                 view.scale < fitScale() * SETTINGS.pinsFadeBelowZoom;
  pinEls.forEach((node, i) => {
    node.hidden = !needsAreMet(PINS[i]) || farOut;
  });
  // a route whose button has just gone must not be left lit
  if (litRoute && !pinEls.some(n => !n.hidden && n.dataset.route === litRoute)) {
    lightRoute(null);
  }
}

/* ── step 4: pan and zoom ──────────────────────────────────────────────────
   The map is moved by a single transform on #ht-world:
       translate(x, y) scale(scale)
   with the origin at its top-left corner. So a point (mx, my) in map units
   lands on screen at (x + mx*scale, y + my*scale), and the inverse — screen
   back to map — is (sx - x) / scale. Those two lines are the whole engine.  */

/* While a button-driven move is running the map eases with `buttonGlide`
   instead of `glide`; the moment it settles, the normal value comes back so
   dragging still tracks the hand exactly. */
let easing = false;
function easeNext() {
  easing = true;
  clearTimeout(easeNext.timer);
  easeNext.timer = setTimeout(() => { easing = false; }, SETTINGS.easeForMs);
}
const glideNow = () => (easing ? SETTINGS.buttonGlide : SETTINGS.glide);

const view   = { x: 0, y: 0, scale: 1 };   // what is on screen right now
const target = { x: 0, y: 0, scale: 1 };   // where it is heading
let gliding = false;

const stage = () => el("stage").getBoundingClientRect();

/* The zoom at which the WHOLE artboard is visible, edges and all. */
function wholeScale() {
  const r = stage();
  return Math.min(r.width / mapW, r.height / mapH);
}
/* What the FIT button goes to, and — through minScale below — as far out as
   you may pull. With fitMeans:"cover" this is the smallest zoom at which the
   artwork still covers the stage in both directions, so there is never an
   empty band; it is worked out from the window every time, which is why it
   suits a tall phone and a wide desktop without a number being tuned for
   either. coverScale() itself is defined just below. */
function fitScale() {
  const base = SETTINGS.fitMeans === "whole" ? wholeScale() * SETTINGS.fitPadding
                                             : coverScale();
  return base * SETTINGS.fitZoom;
}
/* "cover" is the opposite of fit: the smallest zoom at which the artwork still
   fills the stage in both directions, so there are no empty bands. */
function coverScale() {
  const r = stage();
  return Math.max(r.width / mapW, r.height / mapH);
}
const minScale = () => fitScale() * SETTINGS.minZoomOfFit;
const maxScale = () => Math.max(SETTINGS.maxZoom, minScale());

/* Keep the map sensibly placed: if it is bigger than the stage, don't allow a
   gap at the edges; if it is smaller, centre it. */
function settle(t) {
  const r = stage();
  const w = mapW * t.scale, h = mapH * t.scale;
  t.x = w <= r.width  ? (r.width  - w) / 2 : clamp(t.x, r.width  - w, 0);
  t.y = h <= r.height ? (r.height - h) / 2 : clamp(t.y, r.height - h, 0);
  return t;
}

function apply() {
  el("world").style.transform =
    "translate(" + view.x + "px," + view.y + "px) scale(" + view.scale + ")";
  /* The route buttons hold their size on screen unless you asked for them to
     grow with the map. The engine only reports the number; the stylesheet
     decides what to do with it, which is what lets .ht-pin:hover add its own
     lift on top without the two fighting over the transform. */
  const counter = SETTINGS.pinScaleWithMap ? 1 : 1 / view.scale;
  for (let i = 0; i < pinEls.length; i++)
    pinEls[i].style.setProperty("--pin-counter", counter.toFixed(4));
  el("zoom-in").disabled  = view.scale >= maxScale() - 0.0001;
  el("zoom-out").disabled = view.scale <= minScale() + 0.0001;
}

/* ease the view towards the target — used by zooming, not by dragging */
let lastFrame = 0;
function glideFrame(now) {
  const gap = Math.min(64, now - lastFrame || 16.7);
  lastFrame = now;
  const k = 1 - Math.pow(1 - glideNow(), gap / 16.7);       // frame-rate independent
  view.x = mix(view.x, target.x, k);
  view.y = mix(view.y, target.y, k);
  view.scale = mix(view.scale, target.scale, k);
  const done = Math.abs(view.x - target.x) < 0.05 &&
               Math.abs(view.y - target.y) < 0.05 &&
               Math.abs(view.scale - target.scale) < 0.00005;
  if (done) { view.x = target.x; view.y = target.y; view.scale = target.scale; }
  apply();
  if (done) { gliding = false; updatePins(); }
  else requestAnimationFrame(glideFrame);
}
function startGlide() {
  if (!gliding) { gliding = true; lastFrame = 0; requestAnimationFrame(glideFrame); }
}

/* set the view immediately, with no easing — used while dragging */
function jumpTo(x, y, scale) {
  view.x = target.x = x;
  view.y = target.y = y;
  view.scale = target.scale = scale;
  settle(view); settle(target);
  apply();
}

/* Zoom to `scale`, keeping the map point currently under (px, py) — measured
   from the top-left of the stage — in exactly the same place afterwards. */
function zoomAbout(px, py, scale, immediate) {
  const next = clamp(scale, minScale(), maxScale());
  const from = target.scale;
  const nx = px - (px - target.x) * (next / from);
  const ny = py - (py - target.y) * (next / from);
  target.scale = next; target.x = nx; target.y = ny;
  settle(target);
  if (immediate) { view.x = target.x; view.y = target.y; view.scale = target.scale; apply(); }
  else startGlide();
}

function zoomByStep(factor, px, py) {
  const r = stage();
  zoomAbout(px === undefined ? r.width / 2 : px,
            py === undefined ? r.height / 2 : py,
            target.scale * factor, false);
}

function zoomToFit() {
  const s = fitScale(), r = stage();
  target.scale = s;
  target.x = (r.width - mapW * s) / 2;
  target.y = (r.height - mapH * s) / 2;
  startGlide();
}

/* ── pointer handling: drag to pan, pinch to zoom ──────────────────────── */
const pointers = new Map();     // live pointers, for pinch
let dragFrom = null, movedBy = 0, pinchGap = 0;

function stagePoint(e) {
  const r = stage();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e) {
  if (e.target.closest(".ht-pin")) return;      // let pin links work normally
  pointers.set(e.pointerId, stagePoint(e));
  el("stage").setPointerCapture(e.pointerId);
  if (pointers.size === 1) {
    const p = stagePoint(e);
    dragFrom = { px: p.x, py: p.y, x: target.x, y: target.y };
    movedBy = 0;
    el("stage").classList.add("is-dragging");
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchGap = Math.hypot(a.x - b.x, a.y - b.y);
    dragFrom = null;
  }
}

function onMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, stagePoint(e));

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const gap = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchGap > 0 && gap > 0) {
      zoomAbout((a.x + b.x) / 2, (a.y + b.y) / 2, target.scale * (gap / pinchGap), true);
    }
    pinchGap = gap;
    return;
  }

  if (!dragFrom) return;
  const p = stagePoint(e);
  movedBy = Math.max(movedBy, Math.hypot(p.x - dragFrom.px, p.y - dragFrom.py));
  jumpTo(dragFrom.x + (p.x - dragFrom.px), dragFrom.y + (p.y - dragFrom.py), view.scale);
}

function onUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchGap = 0;
  if (pointers.size === 0) {
    el("stage").classList.remove("is-dragging");
    // a press that never really moved counts as a click, not a drag
    if (dragFrom && movedBy < SETTINGS.dragThreshold && SETTINGS.clickZoomsOut &&
        !e.target.closest(".ht-pin")) {
      const p = stagePoint(e);
      zoomByStep(1 / SETTINGS.zoomStep, p.x, p.y);
    }
    dragFrom = null;
    updatePins();
  }
}

function onWheel(e) {
  e.preventDefault();
  const p = stagePoint(e);
  // exponential so every notch feels the same at any zoom level
  zoomAbout(p.x, p.y, target.scale * Math.exp(-e.deltaY * SETTINGS.wheelStrength), false);
}

/* ── the coordinate reader (press C) ───────────────────────────────────── */
function wireCoordinateReader() {
  if (!SETTINGS.coordinateReader) return;
  const box = el("coords");
  let on = false;
  addEventListener("keydown", e => {
    if (e.key.toLowerCase() !== "c" || e.target.tagName === "INPUT") return;
    on = !on;
    box.classList.toggle("is-on", on);
  });
  el("stage").addEventListener("pointermove", e => {
    if (!on) return;
    const p = stagePoint(e);
    box.textContent = "x: " + Math.round((p.x - view.x) / view.scale) +
                     "   y: " + Math.round((p.y - view.y) / view.scale);
  });
}

/* ── start ─────────────────────────────────────────────────────────────── */
function begin() {
  writeWords();
  loadArtwork(() => {
    applyStartingLayers();
    buildPins();

    // opening position — phones open filled rather than fitted, because the
    // whole of a map this wide is far too small to read on a narrow screen
    const wanted = window.innerWidth <= SETTINGS.phoneWidth
                 ? SETTINGS.phoneStartZoom : SETTINGS.startZoom;
    const s = wanted === "fit"   ? fitScale()
            : wanted === "cover" ? clamp(coverScale(), minScale(), maxScale())
            : clamp(wanted, minScale(), maxScale());
    const r = stage();
    const c = SETTINGS.startCentre || [mapW / 2, mapH / 2];
    jumpTo(r.width / 2 - c[0] * s, r.height / 2 - c[1] * s, s);
    updatePins();

    const st = el("stage");
    st.addEventListener("pointerdown", onDown);
    st.addEventListener("pointermove", onMove);
    st.addEventListener("pointerup", onUp);
    st.addEventListener("pointercancel", onUp);
    st.addEventListener("wheel", onWheel, { passive: false });
    st.addEventListener("dblclick", e => {
      if (!SETTINGS.doubleClickZoomsIn) return;
      const p = stagePoint(e);
      zoomByStep(SETTINGS.zoomStep, p.x, p.y);
    });

    /* The three buttons ease into place rather than snapping: `glide` is
       dropped to `buttonGlide` for the length of the movement, then put back,
       so dragging keeps its 1:1 feel. The button itself gives a small press,
       which is the .is-pressed class in the stylesheet. */
    const press = (node, run) => node.addEventListener("click", () => {
      node.classList.add("is-pressed");
      setTimeout(() => node.classList.remove("is-pressed"), SETTINGS.pressMs);
      easeNext();
      run();
    });
    press(el("zoom-in"),  () => zoomByStep(SETTINGS.zoomStep));
    press(el("zoom-out"), () => zoomByStep(1 / SETTINGS.zoomStep));
    press(el("zoom-fit"), zoomToFit);

    wirePanel();
    wireCoordinateReader();
    if (SETTINGS.openPanelAtStart) showPanel(SETTINGS.openPanelAtStart);

    addEventListener("resize", () => {
      target.scale = clamp(target.scale, minScale(), maxScale());
      settle(target);
      jumpTo(target.x, target.y, target.scale);
      updatePins();
    });

    // handy from the browser console
    window.HT = { view, target, SETTINGS, WORDS, LAYER_GROUPS, PINS,
                  size: { width: mapW, height: mapH }, artworkGroups, switchState,
                  zoomToFit, zoomByStep };
  });
}

// the artwork sits at the bottom of the file, so wait for the page to be read
if (document.readyState === "loading") addEventListener("DOMContentLoaded", begin);
else begin();

})();
</script>

       ht-artwork  the map. Every Illustrator layer is a <g id="layer-…">, all
                   sharing the artboard's viewBox. To update it, send me the new

     The legend is no longer artwork: from v2.0 it is a list of rows in

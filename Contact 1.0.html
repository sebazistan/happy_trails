<!doctype html>
<html lang="en">
<!-- ═══════════════════════════════════════════════════════════════════════════
     HAPPY TRAILS — CONTACT
     version 1.0

     A reading page. It shares the navigation bar and the whole palette with
     the map pages through happy-trails.css; everything else it needs lives in
     that file's section ④, under body.page-text.

     There is no script here on purpose. The map pages need one; a page of
     words does not, and the less there is the less there is to go wrong.

     TO EDIT: the words are the words. Change them in place.
     ═══════════════════════════════════════════════════════════════════════════ -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Happy Trails</title>
<meta name="description" content="Get in touch about the Happy Trails map of the Greater Toronto Area.">
<link rel="stylesheet" href="happy-trails.css">
</head>
<body class="page-text">

<!-- the same bar as every other page on the site -->
<header id="ht-bar">
  <a id="ht-brand" href="index.html">Happy Trails</a>
  <nav id="ht-nav">
    <a href="index.html">Map</a>
    <a href="Trails%201.0.html">Trails</a>
    <a href="About%201.0.html">About</a>
    <a href="Contact%201.0.html" class="is-here" aria-current="page">Contact</a>
  </nav>
</header>

<main>
  <div class="pt-head">
    <div class="pt-kicker">Say hello</div>
    <h1>Contact</h1>
    <p class="pt-lede">Get in touch — corrections to the map, trails I have
      missed, or anything about the project.</p>
  </div>

  <!-- The form posts nowhere on its own: a plain HTML page cannot send mail.
       It is wired to open a message in your own mail app, pre-filled, which
       works everywhere without a server. Point the action at a form service
       (Formspree, Basin, Netlify Forms) if you would rather it submitted. -->
  <form class="pt-contact" action="mailto:sebazistan@gmail.com"
        method="post" enctype="text/plain">
    <div class="pt-field">
      <label for="pt-name">Your name</label>
      <input id="pt-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="pt-field">
      <label for="pt-email">Your email</label>
      <input id="pt-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="pt-field">
      <label for="pt-message">Message</label>
      <textarea id="pt-message" name="message" required></textarea>
    </div>
    <button class="pt-send" type="submit">Send</button>
  </form>

  <p class="pt-mail">Or write directly to
    <a href="mailto:sebazistan@gmail.com">sebazistan@gmail.com</a>.</p>

  <footer class="pt-foot">
    <span>Happy Trails — the multi-use trails of the Greater Toronto Area.</span>
    <span><a href="index.html">Main map</a> · <a href="Contact%201.0.html">Get in touch</a></span>
  </footer>
</main>

</body>
</html>

     Finch Corridor — a trail page
     version 1.0   (PLACEHOLDER)

     Everything on this page is temporary except its shape. The map is drawn,
     not surveyed; the waypoints sit at plausible places along it; the heights
     and the text are invented. What is real is the structure — this is exactly
     the file the finished trail will be, so replacing the placeholder parts is
     the whole job.

     TO FINISH THIS TRAIL
       1. drop the real drawing into the <template id="tm-artwork"> at the
          bottom, keeping one <path id="route"> and the #wp-N circles
       2. write the waypoints below: title, height in metres, words, pictures
       3. put the pictures in media/finch/
       4. set trailLength to the real distance and the page works the rest out

     How a trail page WORKS is in trail-engine.js, shared by every trail.
     Colours and sizes are in happy-trails.css, shared by every page.
     ═══════════════════════════════════════════════════════════════════════════ -->

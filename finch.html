<!-- THE TWO SHARED FILES, in this order. waypoint-card.js holds the waypoint
     card — the picture, the caption, the paged text, the × and the expand
     button — and the main map loads the same file for its own few cards, so
     there is one card on the site rather than two that drift apart.
     trail-engine.js is everything else a trail page does, and it asks for the
     card the moment it runs, so the card has to be loaded first. -->
<script src="icons/dials.js?v=9.9"></script>   <!-- the dial drawings icon-life.js animates -->
<script src="js/icon-life.js?v=9.9"></script>
<script src="js/waypoint-card.js?v=9.9"></script>
<!-- the line from a card to its place on the map. The main map draws the same
     one, from the same file, so the two cannot drift apart. -->
<script src="js/leader-line.js?v=9.9"></script>
<script src="js/trail-engine.js?v=9.9"></script>
<!-- Neither of these is needed to read a trail, and neither can break one:
     both wait for the engine to say it is ready and reach it only through
     window.TRAIL. Drop either <script> and the page loses that one feature
     and nothing else. -->
<script src="js/tour-pace.js?v=9.9"></script>
<script src="js/tour-edge.js?v=9.9"></script>
<script src="js/remembers.js?v=9.9"></script>
<script src="js/trail-graph.js?v=9.9"></script>
<!-- THE PEOPLE ON THE TRAIL. players.js holds the drawings, inlined rather
     than fetched because fetch() does not work on file:// and this site is
     checked by double-clicking; player-rig.js is what makes a drawing move.
     Both are silent on their own — nothing happens until somebody asks for a
     player by name, and the rider on the compass is the only one who does yet.
     It asks TRAIL for the walk; nothing in the engine knows it exists. -->
<script src="js/players.js?v=9.9"></script>
<script src="js/player-rig.js?v=9.9"></script>
<script src="js/cyclist.js?v=9.9"></script>
<script src="js/autoplay.js?v=9.9"></script>
</body>

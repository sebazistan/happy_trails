     THE BELTLINE — a trail page
     version 8.3

     A map that pans along a route as you scroll, keeping the point you are
     "standing on" in the centre of the screen.

     THE FILES
       beltline.html         this file: this trail's settings, words and stops
       trail-engine.js       how a trail page WORKS — shared by every trail,
                             so a fix there is a fix on all of them
       happy-trails.css      every colour, size and font — ONE file,
                             shared by every page on the site
       media/                demo pictures and a demo video — delete these once
                             you have swapped in your own
       map.svg               the artwork, for opening in Illustrator
                             (a copy of it is pasted into the bottom of this
                              file, which is what the page actually shows —
                              see section ④)

     WHAT TO EDIT — all four are marked with a banner like this one:
       ①  SETTINGS    how it looks and behaves
       ②  WORDS       every piece of text on screen
       ③  WAYPOINTS   the stops along the route, with their elevations
       ④  ARTWORK     the map itself, at the very bottom of the file
     Everything between ③ and ④ is the engine and needs no edits.

     VERSION HISTORY
       8.3  the corner title and the type-and-length line above it no longer

            artwork, and it did, but a soft edge on type that size reads as a

            artwork ever swallows the title, the veil under it is the thing to
            darken.
       8.2  Six changes, most of them elsewhere but all of them here too, since
            the stylesheet and the engine are shared.
            On a WISHFUL trail the Wishful thinking switch is now locked on and

            The type-and-length line on those pages is the trails' own purple
            (#e84fff) instead of a pale lavender that vanished against the map.
            THE TRAILS NOW ALL RUN DOWNHILL AND DOWN THE PAGE. The Lower Don was
            walked from the harbour up to the forks, so its first stop sat at the
            bottom of the drawing and the journey went up the screen while the
            reader scrolled down. Reversing it turned up three more doing the
            same thing — the East Don, Etobicoke Creek and Highland Creek — and
            a fourth, the Humber, whose stops were right but whose description
            said the opposite. All five now read the way the page does. Two of
            them are descents, which is what the negative elevation readout was
            built for and the first time anything has used it.
            The pictures on the trails page and behind these opening cards are
            no longer crops of the map. They are drawn as a view along the trail
            from eye height — the photograph that will replace them — because
            the map was already on screen twice and a third copy said nothing.
            A wishful trail's picture has no path in it, only a worn line
            through the grass, which is the honest thing for it to show.
            The opening card is wider and deeper so that picture can be seen.
            The waypoint pin on the map was still the old red accent, sitting
            on top of the green ring the artwork draws underneath it. It is the
            route's colour now, which makes it purple on a wishful trail
            without this being written down twice.
       8.1  Four small things, three of them on other pages but all of them in
            the one stylesheet this page shares.
            The Buy me a coffee link in the white bar is now the site's orange
            (#e8503a) rather than the brand's yellow, which was close enough to
            white to be hard to read up there. On the dark panel, where the
            yellow reads perfectly well, it stays yellow — two variables,
            --coffee-nav and --coffee-ink, so the two places can differ.
            The corner title, kicker and buttons on a trail page are now drawn

            darkened band reads exactly like a covered title, which is what it
            looked like and why it was reported.
            (The other two, on trails.html: the Open the trail buttons work
            again, and the columns now follow the number of trails.)
       8.0  PART of a larger set of changes — see the note that came with this
            build for what is done and what is not.
            Done here: the trail line and the elevation line are now the same
            green the trails are drawn in on the main map (#4ecf4e), because
            they are the same fact drawn twice. A wishful trail is purple
            (#e84fff) throughout instead — one class, body.trail-wishful, set
            from SETTINGS.trailKind. The red accent now has one clearly marked
            home at the top of happy-trails.css.
            Two arrows above the readouts step from waypoint to waypoint,
            greying out at each end, skipping any stop the Wishful thinking
            switch is currently hiding. Wishful thinking now starts OFF.
            Type and length share one line above the title. A short, light

       7.3  the artwork is redrawn, and it now has a wishful layer of its own.
            The demo drawing — mountains, contours, Lake Verrier — has gone.
            This one is drawn as what the Beltline IS: a RAILPATH. That means
            it looks unlike the nine river and corridor trails on purpose. A

            across the street grid instead of following a valley; and it is

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   THIS TRAIL
   Everything below describes the Beltline and nothing else. How a trail page
   WORKS is in trail-engine.js, which every trail shares.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";

/* ── WHAT MAKES THIS TRAIL THIS TRAIL ────────────────────────────────────
   Only what differs from the defaults. Every other setting — how the scroll is
   divided, how cards behave, how the map is drawn — lives in trail-engine.js,
   annotated, in one place for all ten trails. Add a line here and it wins for
   this page alone.                                                          */

const SETTINGS = {
  version:        "8.0",       // shown in the top-right corner
  trailLength:    10.2,        // km end to end; every distance follows from it
  mediaFolder:    "media/beltline/",
  mapFile:        "maps/beltline-map.svg",   // what Download offers
  trailImage:     "images/beltline.png",
};

/* Only the words that name this trail. "Waypoint", "Elevation", "Scroll for
   more" and the rest are shared — see DEFAULT_WORDS in trail-engine.js. */

const WORDS = {
  cornerKicker:  "Type: Railpath &nbsp;·&nbsp; Length: 10.2 km",
  cornerTitle:   "The Beltline",
  openingKicker: "10.2 km · Toronto",
  openingTitle:  "The Beltline, end to end",
  openingBody:   "A mixed-use trail along the path of the former Toronto Belt Line Railway, which ran for about seventy years. Scroll to walk it from the west end to the Brickworks — the map moves under you, and each stop arrives as you reach it.",
  closingTitle:  "Brickworks",
  closingBody:   "Ten kilometres from the rail yards in the west to the Brickworks in the Don Valley. The gaps at Allan Rd and Marlee Ave are the two that would do the most good if they were closed.",
};

/* ═══════════════════════════════════════════════════════════════════════════
   ③  WAYPOINTS
   The stops along the walk. Each one becomes a card that fades in as you
   reach it, plus a name pinned to the map.

   WHERE it sits — pick whichever is easiest, one per waypoint:
     marker: "#wp-tarn"   a shape in the artwork. Draw a small circle in
                          Illustrator, name it, and the page snaps it onto the
                          nearest point of the route. Easiest to place by eye.
     along:  0.42         a fraction of the way along the route, 0 to 1.
     at:     [984, 1112]  a position in the map's own units. The Coordinates
                          button (or the E key) reads these off the map for you.

   metres:  its height. Two or more waypoints with a height is enough — the
            page works out everything in between. Remove them all and the
            elevation readouts disappear.

   mapLink: a web address for the button at the foot of the card — the spot
            on Google Maps, or anywhere else you want to send people. Leave it
            out and that waypoint simply has no button.

   media:   one filename, or a list of them. Write a filename on its own for a
            picture with no caption, or { src: "…", caption: "…" } to give it
            one. The caption shows under the pictures, beside the waypoint
            number, and changes as you move through the carousel. A list becomes a carousel with
            arrows and dots. Videos (.mp4/.webm/.ogv/.mov) autoplay silently
            and loop while their slide is showing. Any shape of picture works —
            it is cropped to fill, never squashed. Leave media out entirely and

<!doctype html>
<html lang="en">
<!-- ═══════════════════════════════════════════════════════════════════════════
     SCROLLING TRAIL MAP
     version 5.4

     A map that pans along a route as you scroll, keeping the point you are
     "standing on" in the centre of the screen.

     THE THREE FILES
       Beltline 5.4.html     this file: your settings, your words, the engine
       happy-trails.css      every colour, size and font — ONE file,
                             shared by every page on the site
       media/                demo pictures and a demo video — delete these once
                             you have swapped in your own
       map.svg               the artwork, for opening in Illustrator
                             (a copy of it is pasted into the bottom of this
                              file, which is what the page actually shows —
                              see section ④)

     WHAT TO EDIT — all four are marked with a banner like this one:
       ①  SETTINGS    how it looks and behaves
       ②  WORDS       every piece of text on screen
       ③  WAYPOINTS   the stops along the route, with their elevations
       ④  ARTWORK     the map itself, at the very bottom of the file
     Everything between ③ and ④ is the engine and needs no edits.

     VERSION HISTORY
       5.4  this page is now The Beltline rather than a demo: its words, its
            pictures and its stops come from the Beltline write-up. It shares
            one stylesheet with the rest of the site, and the main map's
            Beltline button opens it. The map artwork is still the demo one —
            swap beltline-map.svg for the real drawing when it is ready.
       5.3  a closed panel was still catching clicks: at opacity 0 it stayed a
            solid pane over the map, swallowing clicks meant for the waypoints
            beneath it. The `hidden` attribute had been set all along but does
            nothing against a rule that gives the element a display of its own.
            Also: the legend now reads the SAME legend/ folder as the Happy Trails
            map, using the icons exported from that map's Illustrator file, so
            a symbol means the same thing on both pages and is drawn once. A
            missing icon says so in the console instead of leaving a silent gap.
       5.2  a "Google maps" button beside the facts at the foot of a card,
            shown only when that waypoint has a link; a caption under the
            pictures that changes with the slide, beside the waypoint number;
            the circles in the artwork are now drawn small, so the rings you
            see are the ones the page draws and they show over the satellite
            view as well as the printed map
       5.1  the legend's little drawings are real files in a legend/ folder, one
            SVG each, so you can redraw any of them without touching the code;
            the page now draws its own waypoint markers on the route rather than
            relying on the circles in the artwork, so they appear over the
            satellite view too
       5.0  waypoint circles now sit exactly on the route — they had been placed
            on the straight line through the curve's anchors, which drifted from
            the curve itself by up to 17 map units on the tighter bends; their
            spacing is deliberately uneven; a second kind of waypoint, "wishful
            thinking", drawn in purple for stops that are proposed rather than
            built; a LEGEND and a LAYERS panel on a fixed left-hand rail, with
            switches for the wishful-thinking stops and for a satellite view
            rendered from the same terrain as the contours
       4.9  say how long the trail is and the page works the scale out for
            itself: SETTINGS.trailLength takes the walk's real length in
            kilometres, and every distance on the page follows from it.
            metresPerPixel is still there for anyone who would rather give the
            scale directly.
       4.8  a bigger map — 3600x2400 map units instead of 2400x1600 — with a
            longer route, so the ten waypoints are evenly spread instead of
            bunched in the middle; white dots on the elevation graph marking
            where each waypoint falls, taken from the same waypoint list the
            cards are built from; the waypoint card is a little more
            see-through with less blur behind it
       4.7  the site's navigation bar across the top, shared with the Happy
            Trails map but shallower; three link buttons under the corner title
            that hide themselves when they have nowhere to point; a bigger north
            arrow; a round dot on the elevation graph instead of a flat oval;
            the scroll bar across the top and the Coordinates button removed
            (the E key still opens the coordinate reader); pictures and video
            now come from SETTINGS.mediaFolder
       4.6  layout on a single footing: the screen is now described once, at the
            top of the stylesheet, as a top band, a bottom band and a card
            column, and every element is placed against those instead of
            carrying its own offset. Move an edge and everything that leans on
            it moves too. Nothing looks different.
       4.5  ten waypoints and real photographs; the north arrow moved out of the
            artwork and into the page so it stays in the corner; the page now
            matches the map's own paper colour and the gradient across the top
            is gone; a missing picture or video falls back to a placeholder
       4.4  bigger cards; a before/after slider you can drag, as one of the
            kinds of picture a card can hold; the map is blurred behind the
            opening and closing screens and sharpens as you scroll away
       4.3  bigger cards; the picture area is 4:3 and crops anything you put in
            it to fill; several pictures become a carousel; video is supported,
            muted and looping; long text is broken into pages with arrows
            instead of a scrollbar
       4.2  the opening zoom-in and closing zoom-out are slower, and each now
            gets the scroll to itself: the walk does not begin until the zoom-in
            has finished, and the zoom-out does not begin until the progress bar
            reads 100%. Remaining loose numbers moved into SETTINGS.
       4.1  waypoint cards show for a short, adjustable stretch and can be
            closed with × and re-opened by clicking the waypoint on the map;
            the walk no longer starts until the opening screen has gone, and
            the closing screen waits for a little extra scrolling past the end
       4.0  settings, words and waypoints hoisted to the top; styling moved to
            its own file; elevation now comes from the waypoints only
       3.0  route read from a named path in an Illustrator SVG
       2.0  map as a flat image with a clicked route
       1.0  real map tiles (Leaflet) and latitude/longitude
     ═══════════════════════════════════════════════════════════════════════════ -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrolling trail map</title>
<link rel="stylesheet" href="happy-trails.css">
</head>
<body class="page-trail">

<!-- the site's navigation bar. It owns the top of the window; the map and the
     interface both begin underneath it. Its words are in WORDS.bar. -->
<header id="tm-bar">
  <a id="tm-barBrand" href="#"></a>
  <nav id="tm-barNav"></nav>
</header>

<!-- the map and everything drawn on it -->
<div id="tm-stage">
  <div id="tm-world">
    <!-- the artwork is inserted here when the page loads -->
    <svg id="tm-trail" xmlns="http://www.w3.org/2000/svg">
      <path id="tm-trailOutline" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <path id="tm-trailAhead"   fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <path id="tm-trailWalked"  fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div id="tm-labels"></div>
  </div>
</div>
<div id="tm-shade"></div>

<!-- the interface that sits over the map -->
<div id="tm-ui">

  <header id="tm-topbar">
    <div id="tm-brand">
      <div class="tm-kicker" id="tm-cornerKicker"></div>
      <h1 id="tm-cornerTitle"></h1>
      <!-- filled in from WORDS.trailLinks; empty if none of them has an href -->
      <div id="tm-links"></div>
    </div>
    <div id="tm-topright">
      <span id="tm-version"></span>
    </div>
  </header>

  <!-- THE LEFT RAIL
       The compass and the two panel buttons live in one fixed column. This is
       the fix for the panels coming adrift: the buttons are pinned to the
       window and never move, whatever is open. There is only ever ONE panel,
       which slides out beside the rail and swaps its contents, so a button can
       never end up detached from the thing it opens. -->
  <div id="tm-rail">
  <div id="tm-compass" role="img">
    <!-- the arrow is drawn to fill its 24×24 box, so --compass-arrow in the
         stylesheet is the size you actually see -->
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 L20 22 L12 17.4 L4 22 Z"/></svg>
    <span id="tm-north"></span>
  </div>

    <button class="tm-railBtn" id="tm-legendBtn" type="button" aria-expanded="false"
            aria-controls="tm-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round">
        <path d="M4 7h3M4 12h3M4 17h3M11 7h9M11 12h9M11 17h9"/>
      </svg>
      <span class="tm-railName"></span>
    </button>

    <button class="tm-railBtn" id="tm-layersBtn" type="button" aria-expanded="false"
            aria-controls="tm-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linejoin="round">
        <path d="M12 3 21 8l-9 5-9-5 9-5Z"/><path d="M3 13l9 5 9-5"/>
      </svg>
      <span class="tm-railName"></span>
    </button>
  </div>

  <!-- the one panel both buttons open -->
  <aside id="tm-panel" hidden>
    <header id="tm-panelTop">
      <h2 id="tm-panelTitle"></h2>
      <button class="tm-close" id="tm-panelClose" type="button">&times;</button>
    </header>
    <div id="tm-panelNote"></div>
    <div id="tm-panelBody"></div>
  </aside>

  <div id="tm-cards"></div>

  <div id="tm-readouts">
    <div id="tm-numbers">
      <div class="tm-readout" id="tm-boxDistance"><small></small><b id="tm-valDistance">0</b></div>
      <div class="tm-readout" id="tm-boxElevation"><small></small><b id="tm-valElevation">0</b></div>
      <div class="tm-readout tm-optional" id="tm-boxAscent"><small></small><b id="tm-valAscent">0</b></div>
      <div class="tm-gap"></div>
      <div class="tm-readout" id="tm-boxComplete"><small></small><b id="tm-valComplete">0</b></div>
    </div>
    <div id="tm-profile"></div>
  </div>

  <section id="tm-opening">
    <div>
      <div class="tm-kicker" id="tm-openingKicker"></div>
      <h2 id="tm-openingTitle"></h2>
      <p id="tm-openingBody"></p>
      <div id="tm-hint">
        <span id="tm-openingHint"></span>
        <svg width="20" height="26" viewBox="0 0 20 26" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v18M4 15l6 6 6-6"/></svg>
      </div>
    </div>
  </section>

  <section id="tm-closing">
    <div class="tm-box">
      <h2 id="tm-closingTitle"></h2>
      <p id="tm-closingBody"></p>
      <div class="tm-row">
        <div class="tm-readout"><small id="tm-closingLabel1"></small><b id="tm-closingTotal">—</b></div>
        <div class="tm-readout"><small id="tm-closingLabel2"></small><b id="tm-closingAscent">—</b></div>
        <div class="tm-readout"><small id="tm-closingLabel3"></small><b id="tm-closingHigh">—</b></div>
      </div>
    </div>
  </section>
</div>

<div id="tm-scroller"></div>

<!-- optional helper: press E to read coordinates off the map -->
<div id="tm-reader">
  <div id="tm-coords">—</div>
  <div id="tm-readerPanel">
    <h3 id="tm-readerTitle"></h3>
    <p id="tm-readerHelp"></p>
    <textarea id="tm-readerOut" spellcheck="false" readonly></textarea>
    <div id="tm-readerButtons">
      <button class="tm-button" id="tm-copyButton" type="button">Copy</button>
      <button class="tm-button" id="tm-clearButton" type="button">Clear</button>
    </div>
  </div>
</div>

<div id="tm-problem"><p id="tm-problemText"></p></div>

<script>
(function () {
  "use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   ①  SETTINGS
   Every number and switch that changes how the page looks and behaves.
   Colours, fonts and sizes are in trail-map-v4.0.css instead.
   ═══════════════════════════════════════════════════════════════════════════ */

const SETTINGS = {

  version: "5.4",              // shown in the top-right corner

  /* ── THE MAP ────────────────────────────────────────────────────────── */

  artwork: "inline",           // "inline"   use the <svg> at the bottom of this
                               //            file. Works however you open the
                               //            page, including double-clicking it.
                               // "map.png"  or any .jpg/.webp filename, to use a
                               //            flat image instead. A separate .svg
                               //            FILE cannot be used — browsers block
                               //            reading one off the local disk — so
                               //            paste vector artwork into the bottom
                               //            of this file instead.

  mapSize: null,               // [width, height] of the artwork. null reads it
                               // from the SVG's viewBox or the image itself.

  /* ── HOW LONG THE TRAIL IS ──────────────────────────────────────────────
     Two ways to tell the page how far the walk really is. Fill in ONE.

     The page always measures the route for itself, but only in the map's own
     units — the numbers in the SVG's viewBox. It has no way of knowing whether
     one of those units is a metre or a mile, so it needs one of these to turn
     its measurement into a distance.                                        */

  trailLength: 10.2,            // THE EASY ONE. The whole walk, in kilometres.
                               // Type in the real figure — off a guidebook, a
                               // GPS track, whatever you trust — and every
                               // distance on the page is scaled to match it:
                               // the running total, each waypoint's "from
                               // start", and the total on the closing screen.
                               // You do not need to know anything about the
                               // map's scale for this to be right.

  metresPerPixel: null,        // THE OTHER WAY. How many real metres one map
                               // unit covers, read off your scale bar: if 1 km
                               // measures 682 units, it is 1000/682 = 1.47.
                               // Only used when trailLength is null.

                               // Leave BOTH null and every distance readout
                               // removes itself — the page then works in
                               // percentages alone, which is a fine choice for
                               // a route whose real length you do not know.
                               // If both are filled in, trailLength wins.

  /* ── THE ROUTE ──────────────────────────────────────────────────────── */

  routeFrom: "artwork",        // "artwork"  a path inside the SVG above. In
                               //            Illustrator, name the trail path
                               //            "route" in the Layers panel and
                               //            export SVG with Object IDs set to
                               //            "Layer Names".
                               // "paste"    the routePath string below instead.
                               //            Use this when the map is a flat
                               //            image: open your .svg in a text
                               //            editor and copy the route's d="…".

  routeName: "#route",         // what the path is called, for "artwork" mode

  routePath: "",               // the d="…" string, for "paste" mode
  routeArtboard: null,         // [width, height] of the artboard that string was
                               // drawn on, if it differs from the map size

  reverseRoute: false,         // walk it from the other end
  hideDrawnRoute: true,        // hide the artwork's own trail line, since the
                               // page draws its own animated one on top

  /* ── MOVEMENT ───────────────────────────────────────────────────────── */

  pageHeight: 900,             // how tall the page is, in screenfuls. Bigger =
                               // more scrolling per metre = slower, calmer walk.

  followLag: 0.13,             // how lazily the map follows the scrollbar.
                               // 1 = rigid and instant, 0.05 = floaty and slow.

  zoomWalking: 1.0,            // scale while walking. 1 = artwork at true size,
                               // below 1 shows more map, above 1 shows less.
  zoomWalkingPhone: 0.62,      // the same, on narrow screens, which see a much
                               // smaller slice of the map

  zoomOutAtEnds: true,         // begin and end on the whole map, flying in to
                               // the trailhead and back out at the finish.
                               // false removes both swoops and the scrolling
                               // they use, dropping you straight into the walk.
  overviewFit: 0.92,           // how much of the screen the whole map fills
                               // during those swoops. 1 = right to the edges,
                               // lower leaves more of a margin around it.

  /* ── THE BLUR AT EACH END ───────────────────────────────────────────────
     The map is softened behind the opening and closing screens so their text
     reads cleanly over it, and sharpens again as you scroll into the walk. It
     follows those screens exactly: full blur while the text is solid, gone by
     the time the text has gone.                                             */

  blurAtEnds: 16,              // how soft the map gets, in screen pixels.
                               // 0 turns the effect off entirely.

  raisePointOnPhone: 0.16,     // on a phone the card covers the middle, so lift
                               // the walking point this fraction of the screen
                               // above centre. 0 keeps it dead centre.

  /* ── HOW THE SCROLL IS DIVIDED ──────────────────────────────────────────
     The page is longer than the walk. Scrolling from top to bottom passes
     through five stages in order, and only the middle one moves you along the
     trail. Each is measured in walks, so 0.15 means "as much scrolling as 15%
     of the trail takes". Nothing overlaps: every stage gets the scroll to
     itself, which is what stops the map flying in while you are already
     walking, or pulling out before the progress bar has filled.

         openingHold   the opening screen fades. The map sits still, whole.
         zoomInOver    the map flies in to the trailhead. Still no walking.
       ( the walk )    the trail, 0% to 100%.
         zoomOutOver   the map pulls back out. The trail stays at 100%.
         closingHold   the closing screen fades in.

     With the values below, the page is 1.42 walks tall: the progress bar hits
     100% at about 85% of the page, and the closing screen arrives at 96%.  */

  openingHold: 0.06,           // scrolling spent fading the opening screen out
  openingFadeShare: 0.75,      // the opening screen is completely gone this far
                               // through that hold — 0.75 leaves a moment of
                               // clear map before the swoop starts. Keep it
                               // under 1 so the map never flies in behind text.

  zoomInOver: 0.15,            // scrolling the fly-in to the trailhead takes.
                               // This is the speed of that swoop: bigger is
                               // slower and more cinematic, smaller is snappier.
                               // The first step is not taken until it is done.
  zoomOutOver: 0.15,           // the same for the pull-back at the finish, which
                               // does not begin until the trail reads 100%.

  closingHold: 0.06,           // scrolling after the pull-back, before the end
  closingFadeShare: 0.55,      // the closing screen is fully in this far through
                               // that tail. Lower = it arrives sooner.

  /* ── THE TRAIL LINE ─────────────────────────────────────────────────── */
  /* Widths are in map units and are divided by the zoom as you go, so the line
     keeps the same thickness on screen. Colours are in the stylesheet.      */

  trailWidth: 9,               // the walked line, behind you. In map units,
                               // so it grew with the map in 4.8
  trailOutlineExtra: 5,        // how much wider the pale outline under it is,
                               // which is what makes it read on busy artwork
  trailAheadWidth: 0.55,       // the dotted line ahead of you, as a share of
                               // trailWidth. 1 would make it equally heavy.
  trailAheadDot: 0.2,          // length of one dot ahead of you, again as a
  trailAheadGap: 2.4,          // share of trailWidth, and the gap between them
  pointSpacing: 5,             // map units between the points the page generates
                               // along your route. Smaller = smoother, slower.

  /* ── WAYPOINT CARDS ─────────────────────────────────────────────────── */

  /* A card is on screen for cardVisibleFor of the walk and no longer, so the
     map is left clear in between. Raise it to keep cards up for more of the
     route, lower it to show them only right at each waypoint. With seven
     waypoints, 0.075 means a card is up for about half the walk in total. */

  cardVisibleFor: 0.075,       // how much of the route one card stays up for
  cardLead: 0.02,              // it arrives this far before its waypoint, so it
                               // is already readable when you get there
  cardFade: 0.012,             // the fade in and the fade out at either end

  cardCloseMs: 220,            // how long the × takes to fade a card away, and
                               // how long a card takes to come back when the
                               // waypoint is clicked. Milliseconds.
  cardsCanBeClosed: true,      // show the × in the corner of every card
  cardsReopenOnClick: true,    // clicking a waypoint on the map opens its card
                               // again, wherever the scroll happens to be. It
                               // gives way on its own once the walk reaches the
                               // next waypoint.

  /* ── PICTURES AND VIDEO ON THE CARDS ────────────────────────────────────
     Give a waypoint one picture and the card just shows it. Give it several
     and the card grows arrows and dots to step through them. Anything ending
     .mp4, .webm, .ogv or .mov is treated as video.

     Whatever you supply is cropped to fill the card's picture window rather
     than squashed, so portrait, square and widescreen files all sit correctly
     — the shape of that window is --card-media in the stylesheet.          */

  mediaLoop: true,             // the arrows wrap round from the last picture
                               // back to the first
  videoAutoplay: true,         // a video starts by itself when its slide is
                               // showing, and stops when it is not
  videoLoop: true,
  videoMuted: true,            // browsers only allow a video to start on its
                               // own if it is muted. Turn this off and the
                               // reader has to press play.
  videoControls: false,        // show the browser's own play/pause bar

  /* ── THE BEFORE/AFTER SLIDER ────────────────────────────────────────────
     A picture entry written as { before: "…", after: "…" } becomes a slide
     with a handle you drag across to wipe between the two. Both are cropped
     to fill in the usual way, so give it a matching pair — same camera
     position, same shape — and they will line up.                          */

  compareStartsAt: 50,         // where the handle sits when the card opens,
                               // as a percentage from the left
  compareClickToMove: true,    // with a mouse, clicking anywhere on the
                               // picture jumps the handle there. On a touch
                               // screen only the handle itself drags, so that
                               // swiping the card still scrolls the page.
  compareStep: 4,              // how far one arrow-key press moves it, in
                               // percent, when the handle has keyboard focus

  /* ── LONG TEXT ──────────────────────────────────────────────────────────
     A card shows --card-text-lines lines at a time (stylesheet). Anything
     longer is split into pages with ‹ › arrows underneath, rather than a
     scrollbar — a scrollbar inside the card would swallow scrolling meant
     for the map and stop you walking.                                      */

  pageLongText: true,          // false simply cuts the text off instead

  cardFitsWindow: true,        // shrink the text window, page by page, so the
                               // whole card always fits between the corner
                               // title and the readouts along the bottom. On a
                               // tall window you get the full cardTextLines; on
                               // a short one you get fewer lines and more pages,
                               // rather than a card running off the screen.
  cardMinLines: 3,             // never squeeze it below this many lines
  captionFadeMs: 180,          // how long a picture's caption takes to fade out
                               // before the next one fades in. 0 swaps it
                               // instantly. Keep it at or under half of
                               // --media-slide in the stylesheet, so the words
                               // have changed by the time the picture has.

  /* ── THE PANELS AND THE LAYERS ──────────────────────────────────────────
     Two buttons on the left-hand rail, both opening the same panel. */

  legendFolder: "legend/",     // where the legend's little drawings live, one
                               // SVG per row, named after the row's `swatch`
                               // below — legend/trails.svg and so on.
                               // IT MUST END IN A SLASH.
                               //
                               // The Happy Trails map reads this same folder.
                               // Keep one copy of it beside both pages, or a
                               // copy each — either way, redraw an icon and
                               // both pages change together.

  showLegend: true,            // the LEGEND button and its panel
  showLayers: true,            // the LAYERS button and its panel
  openPanelAtStart: null,      // "legend", "layers", or null to start closed

  wishfulOn: true,             // whether the wishful-thinking waypoints start
                               // switched on. Off hides their cards, their
                               // circles on the map, their name chips and their
                               // dots on the elevation graph — everything.

  satelliteOn: false,          // whether the satellite view starts switched on
  satelliteImage: "satellite.jpg",   // the aerial picture, drawn underneath the
                               // artwork and lined up with it exactly. It must
                               // cover the same ground as the map, corner to
                               // corner. null removes the switch.
  satelliteHides: "#topo",     // what to hide when it comes on: a selector for
                               // the group in YOUR artwork holding the printed
                               // map — contours, water, roads, labels. Anything
                               // outside it (here the route and the waypoint
                               // circles) stays drawn on top of the photograph.

  showCompass: true,           // the little north badge in the top-right. The
                               // map is drawn north-up, so it is a fixed label
                               // rather than a needle that turns.

  /* ── THE WAYPOINT MARKERS ───────────────────────────────────────────────
     The rings drawn on the route at each stop. The page draws these itself,
     in front of everything, rather than leaving it to the circles in your
     artwork — which is what lets them show over the satellite view, where the
     artwork underneath is hidden.

     Your artwork's circles are still what PLACES each waypoint (marker:
     "#wp-tarn"), so keep drawing them; they just no longer have to be the
     thing you see. Draw them small in Illustrator and only these will show. */

  drawWaypoints: true,         // false goes back to relying on the artwork
  waypointSize: 26,            // the ring's width on screen, in pixels. It
                               // holds this size however far the map is zoomed,
                               // the way the name chips do.
  waypointRing: 6,             // how thick that ring is
  waypointRingWish: 4,         // and how thick a wishful-thinking one is —
                               // thinner, to match its card

  showWaypointLabels: true,    // the name chips pinned to the map
  showWaypointDots: false,     // add a dot to each chip. Leave false if your
                               // artwork already has its own markers drawn.

  /* ── ELEVATION ──────────────────────────────────────────────────────── */
  /* Heights come from the `metres` values on the waypoints in section ③.
     Give at least two and the page fills in everything between them; give
     none and the elevation readouts and the profile strip remove themselves. */

  smoothElevation: 14,         // rounds off the corners where the straight lines
                               // between waypoints meet. 0 = leave them sharp.

const mix        = (a, b, t) => a + (b - a) * t;
const ramp       = (from, to, x) => { const t = clamp((x - from) / (to - from), 0, 1); return t * t * (3 - 2 * t); };

   Everything that needs a centre or a fit-to-screen measures this rather than
   the window, so the walker sits in the middle of the map and not behind the
   bar. Change --bar-height in the stylesheet and these follow it. */
const stageW = () => el("stage").clientWidth;
const stageH = () => el("stage").clientHeight;
